apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova
  labels:
    app: nova
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nova
        component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: nova
          image: nova:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: nova-secrets
            - configMapRef:
                name: nova-config
          env:
            - name: NEXT_RUNTIME
              value: "nodejs"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nova-data
---
apiVersion: v1
kind: Service
metadata:
  name: nova
  labels:
    app: nova
spec:
  type: ClusterIP
  selector:
    app: nova
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nova-config
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  NOVA_DB_PATH: "/app/data/nova.db"
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-secrets
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_WITH_SECRET"
  NEXTAUTH_URL: "https://nova.example.com"
  # AI provider keys (set as needed)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  # Optional: Sentry
  SENTRY_DSN: ""
  # Optional: Upstash Redis for distributed rate limiting
  UPSTASH_REDIS_REST_URL: ""
  UPSTASH_REDIS_REST_TOKEN: ""
  # Optional: S3-compatible storage
  S3_ENDPOINT: ""
  S3_BUCKET: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  # Optional: Email
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  # Optional: Metrics protection
  METRICS_TOKEN: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nova-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - nova.example.com
      secretName: nova-tls
  rules:
    - host: nova.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova
                port:
                  number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nova
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nova
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nova
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nova
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova
---
# CronJob for database backups (runs every 6 hours)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nova-db-backup
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: nova:latest
              command:
                - /bin/sh
                - -c
                - |
                  node scripts/backup/backup-db.js
              envFrom:
                - secretRef:
                    name: nova-secrets
                - configMapRef:
                    name: nova-config
              volumeMounts:
                - name: data
                  mountPath: /app/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nova-data
---
# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nova
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: nova
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      bearerTokenSecret:
        name: nova-secrets
        key: METRICS_TOKEN
